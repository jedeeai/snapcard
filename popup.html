<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SnapCard</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        background: #ffffff;
        color: #0f1419;
        font-family: -apple-system, "Segoe UI", sans-serif;
      }
      h1 {
        font-size: 15px;
        font-weight: 700;
        margin: 0 0 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h1 img {
        width: 20px;
        height: 20px;
      }
      p.desc {
        font-size: 12px;
        color: #536471;
        line-height: 1.5;
        margin: 0 0 16px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid #eff3f4;
      }
      .row label {
        font-size: 13px;
        color: #0f1419;
      }
      /* Colorblind-safe toggle: blue when on, neutral gray when off — no red/green. */
      .switch {
        position: relative;
        display: inline-block;
        width: 38px;
        height: 22px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        inset: 0;
        background: #cfd9de;
        border-radius: 9999px;
        transition: background-color 0.15s ease;
      }
      .slider::before {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        left: 3px;
        top: 3px;
        background: #ffffff;
        border-radius: 50%;
        transition: transform 0.15s ease;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      input:checked + .slider {
        background: #1d9bf0;
      }
      input:checked + .slider::before {
        transform: translateX(16px);
      }
      footer {
        margin-top: 16px;
        font-size: 12px;
      }
      footer a {
        color: #1d9bf0;
        text-decoration: none;
      }
      footer a:hover {
        text-decoration: underline;
      }
      /* Brand bar: SnapCard is an xbangdan.com project. This lives only in
         the extension's own UI (popup) — generated cards themselves stay
         unbranded except for the optional "SnapCard" watermark. */
      .brand-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #eff3f4;
        color: #536471;
        font-size: 12px;
        text-decoration: none;
      }
      .brand-bar img {
        height: 20px;
        width: auto;
        flex-shrink: 0;
      }
      .brand-bar:hover {
        color: #1d9bf0;
      }
    </style>
  </head>
  <body>
    <h1><img src="icons/icon48.png" alt="" />SnapCard</h1>
    <p class="desc" data-i18n="extDescription">Turn any post on X into a beautiful shareable card.</p>

    <div class="row">
      <label for="watermark-toggle" data-i18n="watermarkLabel">Show the SnapCard watermark on cards</label>
      <span class="switch">
        <input type="checkbox" id="watermark-toggle" />
        <span class="slider"></span>
      </span>
    </div>

    <footer><a href="https://github.com/" target="_blank" rel="noopener">GitHub</a></footer>

    <a class="brand-bar" href="https://xbangdan.com" target="_blank" rel="noopener">
      <img src="assets/xbangdan-logo.svg" data-i18n-alt="brandLogoAlt" alt="xbangdan" />
      <span data-i18n="brandBarText">Made by xbangdan.com</span>
    </a>

    <script src="popup.js"></script>
  </body>
</html>
