<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>SnapCard mock</title>
</head>
<body>

<!-- Mock chrome extension API: storage.sync/local are real in-memory stores
     (so the theme/customBg round-trip is actually exercised), sendMessage
     always resolves { ok:false } (simulates translation being unreachable,
     which the smoke test explicitly does not need to succeed), getURL
     resolves to the *real* assets/ folder (mock.html lives in tests/, so
     '../' + path reaches the actual assets/bg-aurora.jpg) — this exercises
     the real wallpaper file end to end instead of a synthetic stand-in.

     storage.*.get callbacks fire via a small setTimeout rather than
     synchronously: headless Chromium resolves requestAnimationFrame almost
     instantly (no real vsync to wait on), so with a synchronous mock the
     whole "open modal -> extract -> read settings -> build card" chain used
     to finish before a test's very next CDP round-trip even landed, making
     the loading-spinner state unobservable/racy. A little realistic latency
     (real chrome.storage calls aren't synchronous either) gives the smoke
     test a deterministic window to see the spinner before it's replaced. -->
<script>
  window.__sentMessages = [];
  const __syncStore = {};
  const __localStore = {};

  // ---- i18n mock ----
  // window.__snapcardI18nMessages is injected by smoke.py (via
  // page.add_init_script, before this script or content.js/card.js run) by
  // reading the *real* _locales/en/messages.json and _locales/zh_CN/messages.json
  // off disk — this mock never hand-copies message text, it just re-implements
  // chrome.i18n.getMessage()'s placeholder substitution against whatever those
  // real files contain, so a smoke-test pass actually proves the shipped
  // message files produce the right on-screen text.
  //
  // window.__snapcardLocale starts at "zh-CN" (today's default UI language for
  // this test) and can be flipped to "en" mid-test (see smoke.py's English
  // scenario) to exercise the other locale — chrome.i18n.getUILanguage() and
  // getMessage() both read it live, no page reload needed, matching how
  // content.js/card.js call them fresh on every modal open/rebuild.
  window.__snapcardLocale = window.__snapcardLocale || "zh-CN";
  window.__snapcardI18nMessages = window.__snapcardI18nMessages || { en: {}, zh_CN: {} };

  function __mockGetMessage(key, substitutions) {
    const localeKey = (window.__snapcardLocale || "zh-CN").replace(/-/g, "_");
    const table = window.__snapcardI18nMessages[localeKey] || window.__snapcardI18nMessages.en || {};
    const entry = table[key];
    if (!entry) return "";
    const subs = substitutions == null ? [] : Array.isArray(substitutions) ? substitutions : [substitutions];
    const placeholders = entry.placeholders || {};
    return (entry.message || "").replace(/\$([A-Za-z0-9_]+)\$/g, (whole, name) => {
      const ph = placeholders[name.toLowerCase()] || placeholders[name];
      if (!ph) return whole;
      const m = String(ph.content || "").match(/^\$(\d+)$/);
      if (!m) return ph.content || "";
      const idx = parseInt(m[1], 10) - 1;
      return subs[idx] != null ? String(subs[idx]) : "";
    });
  }

  window.chrome = {
    i18n: {
      getUILanguage: () => window.__snapcardLocale || "zh-CN",
      getMessage: (key, substitutions) => __mockGetMessage(key, substitutions),
    },
    runtime: {
      id: "fake-extension-id",
      getURL: (path) => "../" + path,
      sendMessage: (msg) => {
        window.__sentMessages.push(msg);
        return Promise.resolve({ ok: false, error: "mock: no network in smoke test" });
      },
      onMessage: { addListener: () => {} },
    },
    storage: {
      sync: {
        get: (defaults, cb) => setTimeout(() => cb(Object.assign({}, defaults, __syncStore)), 30),
        set: (items, cb) => {
          Object.assign(__syncStore, items);
          if (cb) cb();
        },
      },
      local: {
        get: (defaults, cb) => setTimeout(() => cb(Object.assign({}, defaults, __localStore)), 30),
        set: (items, cb) => {
          Object.assign(__localStore, items);
          if (cb) cb();
        },
        remove: (key, cb) => {
          delete __localStore[key];
          if (cb) cb();
        },
      },
    },
  };
</script>

<!-- One tweet, structured like real x.com DOM as of 2026-08:
     - User-Name with an emoji <img alt> spliced into the display name and a blue-check svg
     - tweetText with an emoji <img alt> in the body
     - role=group aria-label carrying the four interaction stats
     - one tweetPhoto image (1x1 transparent data URI, avoids any network fetch)
     - a time[datetime] element -->
<article data-testid="tweet">
  <div data-testid="User-Name">
    <div>
      <div dir="ltr">
        <a href="/jack" role="link">
          <span>Jack<img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7" alt="🚀" draggable="false"></span>
        </a>
      </div>
      <span><svg aria-label="Verified account" width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></span>
    </div>
    <div>
      <div dir="ltr"><span>@jack</span></div>
    </div>
  </div>

  <div data-testid="tweetText">
    <span>Shipping SnapCard today</span>
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7" alt="🎉" draggable="false">
    <span> — turn any post into a card.</span>
  </div>

  <div data-testid="tweetPhoto">
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7">
  </div>

  <time datetime="2026-08-19T01:41:00.000Z">9:41 AM</time>

  <div role="group" aria-label="446 replies, 1210 reposts, 8408 likes, 2680000 views">
    <div role="button" data-testid="reply">446</div>
    <div role="button" data-testid="retweet">1.2K</div>
    <div role="button" data-testid="like">8.4K</div>
    <div role="button" data-testid="analytics">2.6M</div>
  </div>
</article>

<!-- Second tweet, dedicated to the "media grid mirrors X's own display ratio"
     regression: two tweetPhoto containers explicitly sized 254x460 (a tall
     9:16-ish portrait screenshot ratio, ~0.552), like X's own timeline layout
     gives a pair of portrait screenshots. extractImages() reads this via
     getBoundingClientRect() on the *live* article, so the container's real
     inline size (not the 1x1 image's natural size) is what must come through
     as each photo's aspectRatio. id="tweet-2col" lets the test target this
     article's own "生成卡片" button specifically. -->
<article data-testid="tweet" id="tweet-2col">
  <div data-testid="User-Name">
    <div>
      <div dir="ltr">
        <a href="/jack" role="link"><span>Jack</span></a>
      </div>
    </div>
    <div>
      <div dir="ltr"><span>@jack</span></div>
    </div>
  </div>

  <div data-testid="tweetText">
    <span>Two tall screenshots, side by side.</span>
  </div>

  <div data-testid="tweetPhoto" style="width:254px;height:460px;display:block;">
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7" style="width:100%;height:100%;">
  </div>
  <div data-testid="tweetPhoto" style="width:254px;height:460px;display:block;">
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7" style="width:100%;height:100%;">
  </div>

  <time datetime="2026-08-19T01:41:00.000Z">9:41 AM</time>

  <div role="group" aria-label="10 replies, 5 reposts, 40 likes, 900 views">
    <div role="button" data-testid="reply">10</div>
    <div role="button" data-testid="retweet">5</div>
    <div role="button" data-testid="like">40</div>
    <div role="button" data-testid="analytics">900</div>
  </div>
</article>

<script src="../card.js"></script>

</body>
